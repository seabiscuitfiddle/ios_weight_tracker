# XcodeGen manifest — run `xcodegen generate` to produce Tally.xcodeproj.
#
# The .xcodeproj is generated and gitignored on purpose. A .pbxproj is thousands of lines of
# machine-written XML that merges badly and cannot be reviewed; this file is the same
# information in a form a human can read and a diff can show.
#
# ┌─────────────────────────────────────────────────────────────────────────────────────┐
# │ VALUES YOU MUST SUPPLY BEFORE BUILDING ON A DEVICE — see README "What you must       │
# │ fill in". None of them are needed for the simulator.                                 │
# │                                                                                      │
# │  1. BUNDLE_ID_PREFIX → a reverse-DNS prefix you control                              │
# │  2. DEVELOPMENT_TEAM → your 10-character Apple Developer Team ID                     │
# │  3. Register the App Group `group.<prefix>.tally` in the developer portal            │
# │                                                                                      │
# │ Set 1 and 2 in a local `.env` — copy `.env.example` — NOT in this file. This file is │
# │ public and an Apple Team ID identifies its owner. `./scripts/bootstrap.sh` loads     │
# │ the .env and XcodeGen substitutes the ${...} references below at generation time.    │
# │                                                                                      │
# │ The App Group is the one that fails quietly: a mismatch between here and the portal  │
# │ produces a widget that is permanently empty, with no build error to explain it.      │
# └─────────────────────────────────────────────────────────────────────────────────────┘

name: Tally

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

# One prefix, referenced everywhere as ${BUNDLE_ID_PREFIX}: the app, the widget, the App Group
# and the keychain group all derive from it, and they must agree.
#
# Two substitutions are in play and it is worth knowing which is which. XcodeGen replaces
# ${VAR} at *generation* time when VAR is in the environment; anything it leaves alone is
# expanded by Xcode at *build* time from the build settings defined here. That is why the
# fallback below is a literal: with no .env, `xcodegen generate` leaves ${BUNDLE_ID_PREFIX}
# in place and Xcode resolves it to com.example, so a fresh clone still builds.
settings:
  base:
    # Overridden by BUNDLE_ID_PREFIX in your .env. Never put a real prefix here.
    BUNDLE_ID_PREFIX: com.example
    # Empty is correct for the simulator, so no fallback is wanted: with no .env this expands
    # to nothing and the build is simply unsigned.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    # The single definition of the shared container, referenced by both entitlements files.
    # The widget's own bundle identifier is <prefix>.tally.widget, but it must open the app's
    # group, so this is spelled out once here rather than derived per-target.
    APP_GROUP_ID: group.${BUNDLE_ID_PREFIX}.tally
    SWIFT_VERSION: "6.0"
    # Warnings-as-errors is off deliberately: a warning should not stop someone building the
    # app to try it, and CI checks the same code with its own stricter settings.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  Tally:
    path: .

targets:
  # ────────────────────────────────────────────────────────────────────────────────────
  TallyApp:
    type: application
    platform: iOS
    sources:
      - path: App
        # Keeps the fonts-directory placeholder note out of the app bundle.
        excludes:
          - "**/*.md"
    dependencies:
      - package: Tally
        product: TallyCore
      - package: Tally
        product: TallyStore
      - target: TallyWidget
        embed: true
    settings:
      base:
        PRODUCT_NAME: Tally
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.tally
        INFOPLIST_KEY_CFBundleDisplayName: Tally
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Portrait only. Every screen in the design is a single portrait column, and a
        # landscape layout would be a different design rather than a stretched one.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: App/Tally.entitlements
        ENABLE_PREVIEWS: YES
        # App/Resources/Assets.xcassets. Regenerate the artwork with scripts/render-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tally
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false

        # Opens the widget's quick-log buttons. Must match DeepLink.scheme in TallyCore —
        # changing one without the other breaks every button with no error.
        CFBundleURLTypes:
          - CFBundleURLName: ${BUNDLE_ID_PREFIX}.tally.deeplink
            CFBundleURLSchemes: [tally]

        # Permission strings. iOS terminates the app on first use of a capability whose
        # description is missing, so an omission here is a crash, not a missing feature.
        NSCameraUsageDescription: >-
          Take a photo of a meal to estimate its calories and macros.
        NSPhotoLibraryUsageDescription: >-
          Choose a photo of a meal to estimate its calories and macros.
        NSMicrophoneUsageDescription: >-
          Describe what you ate out loud instead of typing it.
        NSSpeechRecognitionUsageDescription: >-
          Speech is transcribed on your device to turn what you say into a log entry.
        NSHealthShareUsageDescription: >-
          Read your weight and workouts from Health so Tally can fill them in for you.

        # Archivo, added by you — see README. Both the static faces and the variable font are
        # listed because Google Fonts now ships the variable one by default; entries for files
        # you don't have are ignored. The app falls back to the system font when none are
        # present, so a missing font looks wrong rather than crashing.
        UIAppFonts:
          - Archivo-Regular.ttf
          - Archivo-SemiBold.ttf
          - Archivo-ExtraBold.ttf
          - Archivo[wdth,wght].ttf

  # ────────────────────────────────────────────────────────────────────────────────────
  TallyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
    dependencies:
      - package: Tally
        product: TallyCore
      - package: Tally
        product: TallyStore
    settings:
      base:
        PRODUCT_NAME: TallyWidget
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.tally.widget
        CODE_SIGN_ENTITLEMENTS: Widget/TallyWidget.entitlements
        ENABLE_PREVIEWS: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Tally
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # ────────────────────────────────────────────────────────────────────────────────────
  TallyAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: TallyApp
      - package: Tally
        product: TallyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.tally.tests
        GENERATE_INFOPLIST_FILE: YES
        # Spelled out because the app sets PRODUCT_NAME to "Tally" while its target is named
        # "TallyApp", and the generated default points at TallyApp.app/TallyApp — a path that
        # never exists. Keep the app name here in step with TallyApp's PRODUCT_NAME above.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Tally.app/Tally
        BUNDLE_LOADER: $(TEST_HOST)

  TallyAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    dependencies:
      - target: TallyApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.tally.uitests
        GENERATE_INFOPLIST_FILE: YES
        # UI tests drive the app from outside, so they need the target's name rather than a
        # host binary path.
        TEST_TARGET_NAME: TallyApp

schemes:
  TallyApp:
    build:
      targets:
        TallyApp: all
        TallyWidget: all
    test:
      targets:
        - TallyAppTests
        - TallyAppUITests
      gatherCoverageData: true
    run:
      config: Debug
