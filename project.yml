# XcodeGen manifest — run `xcodegen generate` to produce Tally.xcodeproj.
#
# The .xcodeproj is generated and gitignored on purpose. A .pbxproj is thousands of lines of
# machine-written XML that merges badly and cannot be reviewed; this file is the same
# information in a form a human can read and a diff can show.
#
# ┌─────────────────────────────────────────────────────────────────────────────────────┐
# │ VALUES YOU MUST SUPPLY BEFORE BUILDING ON A DEVICE — see README "What you must       │
# │ fill in". None of them are needed for the simulator.                                 │
# │                                                                                      │
# │  1. APP_BUNDLE_ID    → the app's bundle identifier, a reverse-DNS name you control   │
# │  2. DEVELOPMENT_TEAM → your 10-character Apple Developer Team ID                     │
# │  3. Register the App Group `group.<APP_BUNDLE_ID>` in the developer portal           │
# │                                                                                      │
# │ Set 1 and 2 in a local `.env` — copy `.env.example` — NOT in this file. This file is │
# │ public and an Apple Team ID identifies its owner. `./scripts/bootstrap.sh` loads     │
# │ the .env and XcodeGen substitutes the ${...} references below at generation time.    │
# │                                                                                      │
# │ The App Group is the one that fails quietly: a mismatch between here and the portal  │
# │ produces a widget that is permanently empty, with no build error to explain it.      │
# └─────────────────────────────────────────────────────────────────────────────────────┘

name: Tally

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

# One identifier, referenced everywhere as ${APP_BUNDLE_ID}: the widget, the test bundles, the
# App Group, the keychain group and the deep-link scheme name all derive from it, and they must
# agree.
#
# It is the app's *whole* bundle identifier, not a prefix. It was `BUNDLE_ID_PREFIX` with
# `.tally` appended until it met App Store Connect, where the bundle ID on an app record is
# permanent — so the project has to be able to produce whatever identifier that record was
# created with, rather than only ever `<something>.tally`. The default below keeps every
# generated identifier exactly what it was before the change.
#
# Two substitutions are in play and it is worth knowing which is which. XcodeGen replaces
# ${VAR} at *generation* time when VAR is in the environment; anything it leaves alone is
# expanded by Xcode at *build* time from the build settings defined here. That is why the
# fallback below is a literal: with no .env, `xcodegen generate` leaves ${APP_BUNDLE_ID}
# in place and Xcode resolves it to com.example.tally, so a fresh clone still builds.
settings:
  base:
    # Overridden by APP_BUNDLE_ID in your .env. Never put a real identifier here.
    APP_BUNDLE_ID: com.example.tally
    # Empty is correct for the simulator, so no fallback is wanted: with no .env this expands
    # to nothing and the build is simply unsigned.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    # The single definition of the shared container, referenced by both entitlements files.
    # The widget's own bundle identifier is <APP_BUNDLE_ID>.widget, but it must open the app's
    # group, so this is spelled out once here rather than derived per-target.
    #
    # `group.` + the app's bundle ID is not an arbitrary convention: TallyDatabase derives the
    # same string at runtime from Bundle.main, so this and the code cannot drift.
    APP_GROUP_ID: group.${APP_BUNDLE_ID}
    # Version and build number, referenced from both `info:` blocks below rather than left to
    # XcodeGen's defaults — those are the literals "1.0" and "1", which App Store Connect rejects
    # on the second upload because the build number never changes. The TestFlight workflow
    # overrides CURRENT_PROJECT_VERSION with the run number; MARKETING_VERSION is bumped by hand
    # when the release is worth a new number.
    #
    # The app and the widget must agree on both values. They do because both read these, and a
    # mismatch is an upload-time rejection ("bundle version does not match").
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    # iPhone only (1 = iPhone, 2 = iPad), overriding XcodeGen's "1,2" default. Here rather than
    # per-target because an embedded extension may not claim more device families than the app
    # that contains it, so the widget has to agree.
    #
    # This is the portrait-only decision on TallyApp's UISupportedInterfaceOrientations,
    # enforced. An app that claims iPad support must either support all four orientations or
    # opt out of multitasking, and iPadOS 26 no longer honours the opt-out
    # (UIRequiresFullScreen) for apps built against its SDK — so "supports iPad" and "portrait
    # only" can no longer both be true. The design is portrait, so iPad support gives way.
    # App Store Connect enforces this at upload, as "No orientations were specified in the
    # bundle", quoting the four orientations iPad multitasking wants.
    TARGETED_DEVICE_FAMILY: "1"
    # Warnings-as-errors is off deliberately: a warning should not stop someone building the
    # app to try it, and CI checks the same code with its own stricter settings.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  Tally:
    path: .

targets:
  # ────────────────────────────────────────────────────────────────────────────────────
  TallyApp:
    type: application
    platform: iOS
    sources:
      - path: App
        # Keeps the fonts-directory placeholder note out of the app bundle.
        excludes:
          - "**/*.md"
    dependencies:
      - package: Tally
        product: TallyCore
      - package: Tally
        product: TallyStore
      # The provider-agnostic LLM layer. Linked directly because the app names providers and
      # endpoints in Settings, not only through TallyCore's parser.
      - package: Tally
        product: LLMWire
      - target: TallyWidget
        embed: true
    settings:
      base:
        PRODUCT_NAME: Tally
        PRODUCT_BUNDLE_IDENTIFIER: ${APP_BUNDLE_ID}
        CODE_SIGN_ENTITLEMENTS: App/Tally.entitlements
        ENABLE_PREVIEWS: YES
        # Manual signing, for the TestFlight workflow only. This is the one setting that cannot
        # go on the xcodebuild command line: the app and the widget need *different* profiles,
        # and a command-line build setting applies to every target at once.
        #
        # Empty everywhere else, by the same mechanism as DEVELOPMENT_TEAM above — with no env
        # var set, XcodeGen leaves the ${...} alone and Xcode resolves it to nothing, so opening
        # the project on a Mac still uses automatic signing. The workflow reads the profile's
        # name out of the profile itself, so this never has to be written down anywhere.
        PROVISIONING_PROFILE_SPECIFIER: ${APP_PROVISIONING_PROFILE}
        # App/Resources/Assets.xcassets. Regenerate the artwork with scripts/render-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tally
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false

        # Portrait only. Every screen in the design is a single portrait column, and a landscape
        # layout would be a different design rather than a stretched one. See
        # TARGETED_DEVICE_FAMILY in `settings:` above, which this obliges.
        #
        # Here, and not as INFOPLIST_KEY_UISupportedInterfaceOrientations in `settings:`, which
        # is where it was and did nothing: the INFOPLIST_KEY_* settings are inputs to the
        # Info.plist *Xcode* generates, and are ignored by a target that supplies its own file,
        # as this one does. Nothing warns about it. The key was simply absent from every build
        # until App Store Connect rejected the upload for having no orientations at all.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

        # Build-setting references, not literals, so CI can override the build number without
        # editing a tracked file. See MARKETING_VERSION in `settings:` above.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)

        # Opens the widget's quick-log buttons. Must match DeepLink.scheme in TallyCore —
        # changing one without the other breaks every button with no error.
        CFBundleURLTypes:
          - CFBundleURLName: ${APP_BUNDLE_ID}.deeplink
            CFBundleURLSchemes: [tally]

        # Permission strings. iOS terminates the app on first use of a capability whose
        # description is missing, so an omission here is a crash, not a missing feature.
        NSCameraUsageDescription: >-
          Take a photo of a meal to estimate its calories and macros.
        NSPhotoLibraryUsageDescription: >-
          Choose a photo of a meal to estimate its calories and macros.
        NSMicrophoneUsageDescription: >-
          Describe what you ate out loud instead of typing it.
        NSSpeechRecognitionUsageDescription: >-
          Speech is transcribed on your device to turn what you say into a log entry.
        NSHealthShareUsageDescription: >-
          Read your weight and workouts from Health so Tally can fill them in for you.
        # Required by App Store Connect, not by the code: HealthKitImporter asks for read access
        # only (`toShare: []`), but validation keys off the HealthKit *entitlement* and rejects
        # the upload unless both strings are present. Worded to say what the app does, since a
        # string iOS will never display should still be true if someone reads it.
        NSHealthUpdateUsageDescription: >-
          Tally only reads from Health. It does not write your weight or workouts back.

        # Archivo, added by you — see README. Both the static faces and the variable font are
        # listed because Google Fonts now ships the variable one by default; entries for files
        # you don't have are ignored. The app falls back to the system font when none are
        # present, so a missing font looks wrong rather than crashing.
        UIAppFonts:
          - Archivo-Regular.ttf
          - Archivo-SemiBold.ttf
          - Archivo-ExtraBold.ttf
          - Archivo[wdth,wght].ttf

  # ────────────────────────────────────────────────────────────────────────────────────
  TallyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
    dependencies:
      - package: Tally
        product: TallyCore
      - package: Tally
        product: TallyStore
    settings:
      base:
        PRODUCT_NAME: TallyWidget
        PRODUCT_BUNDLE_IDENTIFIER: ${APP_BUNDLE_ID}.widget
        CODE_SIGN_ENTITLEMENTS: Widget/TallyWidget.entitlements
        ENABLE_PREVIEWS: YES
        # The widget's own App Store profile — see the note on TallyApp. An extension is signed
        # separately from its host and needs its own App ID; reusing the app's profile here is
        # the mistake that produces "provisioning profile does not match bundle identifier".
        PROVISIONING_PROFILE_SPECIFIER: ${WIDGET_PROVISIONING_PROFILE}
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Tally
        # Must match the app's, exactly. App Store Connect rejects an upload whose extension
        # disagrees with its host on either value.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # ────────────────────────────────────────────────────────────────────────────────────
  TallyAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: TallyApp
      - package: Tally
        product: TallyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${APP_BUNDLE_ID}.tests
        GENERATE_INFOPLIST_FILE: YES
        # Spelled out because the app sets PRODUCT_NAME to "Tally" while its target is named
        # "TallyApp", and the generated default points at TallyApp.app/TallyApp — a path that
        # never exists. Keep the app name here in step with TallyApp's PRODUCT_NAME above.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Tally.app/Tally
        BUNDLE_LOADER: $(TEST_HOST)

  TallyAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    dependencies:
      - target: TallyApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${APP_BUNDLE_ID}.uitests
        GENERATE_INFOPLIST_FILE: YES
        # UI tests drive the app from outside, so they need the target's name rather than a
        # host binary path.
        TEST_TARGET_NAME: TallyApp

schemes:
  TallyApp:
    build:
      targets:
        TallyApp: all
        TallyWidget: all
    test:
      targets:
        - TallyAppTests
        - TallyAppUITests
      gatherCoverageData: true
    run:
      config: Debug
