[project]
name = "tally-eval"
version = "0.1.0"
description = "Offline harness for Tally's nutrition-parsing prompt."
requires-python = ">=3.11"

# `sync_prompt` and `tests/` need none of this — they run on a bare interpreter, which is what
# makes them safe to wire into CI on a runner with no packages and no API key. Everything below
# exists for the notebook.
dependencies = [
    "httpx>=0.27",         # async HTTP, so a grid of a few hundred calls finishes in the time one takes
    "pandas>=2.2",         # results tables
    "matplotlib>=3.8",     # latency and accuracy plots
    "jupyterlab>=4.2",     # the notebook itself
    "python-dotenv>=1.0",  # reads Experiments/.env so keys never live in the notebook
]

[tool.uv]
# Not installed into the environment. `tally_eval` is imported from this directory — that is how
# `python -m tally_eval.sync_prompt` and the tests work on a checkout with nothing installed, and
# an installed copy would be a second one that goes stale against the tracked source.
package = false
