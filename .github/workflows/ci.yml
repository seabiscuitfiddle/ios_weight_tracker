name: CI

# Two jobs, because they verify genuinely different things:
#
#   package  — runs the real test suite on Linux. All of Tally's logic lives in an SPM package
#              precisely so this is possible: storage, goal arithmetic, LLM request and response
#              handling, deep-link routing and formatting are all covered here, fast and for free.
#
#   app      — compiles the SwiftUI, WidgetKit and AppIntents code on a macOS runner. This is the
#              only thing that can prove those compile at all, since they don't exist on Linux.
#
# NO SECRETS ARE REQUIRED. The app builds for the simulator with signing disabled, so this works
# unchanged on forks and pull requests. See README, "GitHub Actions secrets".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight run redundant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Cheap and first: a leaked Team ID or API key should fail in seconds, not after a
      # simulator boot. This is the same script the pre-commit hook runs, so what passes
      # locally passes here.
      - name: Scan tracked files
        run: ./scripts/check-secrets.sh

  package:
    name: Package tests (Linux)
    runs-on: ubuntu-24.04
    # The official Swift image rather than a setup action. Two reasons: it pins the exact
    # toolchain developers use, and it removes a dependency on a third-party action's list of
    # known versions — asking that action for "6.3" failed with `Version "6.3" is not available`
    # even though 6.3 exists, because its manifest lags releases.
    #
    # Must stay 6.1 or newer. GRDB's manifest requires swift-tools-version 6.1, and on an older
    # toolchain SPM quietly resolves *backwards* to a GRDB release that predates its Linux
    # snapshot guard, which then fails to link. See Package.swift.
    container: swift:6.3.1
    steps:
      - uses: actions/checkout@v4

      - name: Install SQLite headers
        # GRDB compiles against <sqlite3.h>, which Debian/Ubuntu ship separately. Apple platforms
        # get SQLite from the SDK, so this is a Linux-only prerequisite. No sudo: container steps
        # already run as root.
        run: apt-get update && apt-get install -y libsqlite3-dev

      - name: Verify toolchain
        # Kept even though the container pins the version, so that editing the image tag to
        # something too old fails here with an explanation instead of as a linker error deep
        # inside a dependency.
        run: |
          swift --version
          version=$(swift --version 2>&1 | grep -oE 'Swift version [0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+' | head -1)
          major=${version%%.*}
          minor=${version##*.}
          if [ "$major" -lt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -lt 1 ]; }; then
            echo "::error::Swift $version is too old. GRDB needs swift-tools-version 6.1+;" \
                 "older toolchains resolve backwards to a GRDB that fails to link on Linux."
            exit 1
          fi

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

  app:
    name: App build (macOS)
    # Kept in step with testflight.yml's runner on purpose. This job exists to prove the SwiftUI,
    # WidgetKit and AppIntents code compiles; on an older image it would prove that against an
    # older SDK than the one releases are built with, and a compile error under the shipping SDK
    # would first appear during a TestFlight upload instead of here.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Deliberately no `xcode-select`. Pinning a specific Xcode.app is what broke this before:
      # several are installed on the runner and not all of them have an iOS simulator runtime
      # downloaded, so naming one is a coin flip. The runner's default Xcode is the one GitHub
      # provisions simulators for.
      - name: Show toolchain
        run: |
          xcodebuild -version
          echo "--- installed simulator runtimes ---"
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        # The .xcodeproj is not committed; it is regenerated from project.yml on every run,
        # which also means a broken manifest fails here rather than on someone's machine.
        #
        # The two values below are the same ones a local .env supplies, read here from repository
        # secrets. Both are optional and empty on forks and pull requests: XcodeGen then leaves
        # project.yml's placeholders in place and the simulator build below signs nothing. Set
        # them only if you add a job that builds for a device.
        env:
          APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          # An unset secret arrives as the empty string, which would override project.yml's
          # placeholder with nothing, so it is unexported rather than passed through empty.
          # Written as an `if` because steps run under `bash -e`, where a false `&&` chain is
          # itself a step failure.
          if [ -z "${APP_BUNDLE_ID}" ]; then
            unset APP_BUNDLE_ID
          fi
          xcodegen generate

      - name: Choose a simulator
        id: simulator
        # Resolve an actual installed device rather than describing one and hoping. A name-based
        # destination ("iPhone 16") breaks whenever the runner image changes its device set or
        # ships an Xcode without that runtime; a UDID we just read from simctl cannot.
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys

          runtimes = json.load(sys.stdin)["devices"]
          candidates = []
          for runtime, devices in runtimes.items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and "iPhone" in device.get("name", ""):
                      candidates.append((runtime, device["name"], device["udid"]))

          if not candidates:
              sys.exit("no available iPhone simulator found")

          # Newest runtime last, so take the end of the sorted list.
          candidates.sort()
          runtime, name, udid = candidates[-1]
          print(udid)
          print(f"using {name} on {runtime}", file=sys.stderr)
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build and test
        # CODE_SIGNING_ALLOWED=NO is what keeps this secret-free: a simulator build needs no
        # team, no certificate, and no provisioning profile.
        run: |
          set -o pipefail
          xcodebuild \
            -project Tally.xcodeproj \
            -scheme TallyApp \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build test | xcbeautify --renderer github-actions

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
