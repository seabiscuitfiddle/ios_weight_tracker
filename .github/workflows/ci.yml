name: CI

# Two jobs, because they verify genuinely different things:
#
#   package  — runs the real test suite on Linux. All of Tally's logic lives in an SPM package
#              precisely so this is possible: storage, goal arithmetic, LLM request and response
#              handling, deep-link routing and formatting are all covered here, fast and for free.
#
#   app      — compiles the SwiftUI, WidgetKit and AppIntents code on a macOS runner. This is the
#              only thing that can prove those compile at all, since they don't exist on Linux.
#
# NO SECRETS ARE REQUIRED. The app builds for the simulator with signing disabled, so this works
# unchanged on forks and pull requests. See README, "GitHub Actions secrets".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight run redundant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install SQLite headers
        # GRDB compiles against <sqlite3.h>, which Ubuntu ships separately. Apple platforms get
        # SQLite from the SDK, so this is a Linux-only prerequisite.
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

  app:
    name: App build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Deliberately no `xcode-select`. Pinning a specific Xcode.app is what broke this before:
      # several are installed on the runner and not all of them have an iOS simulator runtime
      # downloaded, so naming one is a coin flip. The runner's default Xcode is the one GitHub
      # provisions simulators for.
      - name: Show toolchain
        run: |
          xcodebuild -version
          echo "--- installed simulator runtimes ---"
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        # The .xcodeproj is not committed; it is regenerated from project.yml on every run,
        # which also means a broken manifest fails here rather than on someone's machine.
        run: xcodegen generate

      - name: Choose a simulator
        id: simulator
        # Resolve an actual installed device rather than describing one and hoping. A name-based
        # destination ("iPhone 16") breaks whenever the runner image changes its device set or
        # ships an Xcode without that runtime; a UDID we just read from simctl cannot.
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys

          runtimes = json.load(sys.stdin)["devices"]
          candidates = []
          for runtime, devices in runtimes.items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and "iPhone" in device.get("name", ""):
                      candidates.append((runtime, device["name"], device["udid"]))

          if not candidates:
              sys.exit("no available iPhone simulator found")

          # Newest runtime last, so take the end of the sorted list.
          candidates.sort()
          runtime, name, udid = candidates[-1]
          print(udid)
          print(f"using {name} on {runtime}", file=sys.stderr)
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build and test
        # CODE_SIGNING_ALLOWED=NO is what keeps this secret-free: a simulator build needs no
        # team, no certificate, and no provisioning profile.
        run: |
          set -o pipefail
          xcodebuild \
            -project Tally.xcodeproj \
            -scheme TallyApp \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build test | xcbeautify --renderer github-actions

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
